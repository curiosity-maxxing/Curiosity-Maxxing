const score=c=>{const m=me(),k=(c.category||"").toLowerCase(),p=prog(c);return((m.interests||[]).some(i=>i.toLowerCase()==k)?6:0)+((m.w||{})[c.category]||0)+(c.featured?1:0)-(p.n&&p.d==p.n?20:0)};

const bl=()=>({t:"",b:"",l:"",type:"text",piece:"rook",rounds:4,code:"",expect:""});

 return !!({rook:!dx||!dy,bishop:x==y,queen:!dx||!dy||x==y,knight:x+y==3&&x&&y,king:Math.max(x,y)==1,pawn:!dx&&(dy==-1||(dy==-2&&(a>>3)==6))}[p])&&a!=b};
const newPos=p=>{let s;do{s=Math.floor(Math.random()*64)}while(p=="pawn"&&((s>>3)<1||(s>>3)>6));return s};

let pyP=null;

 s.onload=()=>loadPyodide().then(res,e=>{pyP=null;rej(e)});s.onerror=()=>{pyP=null;rej(new Error("Could not load Python. Check your connection."))};document.head.append(s)}));
const board=()=>{let h='<div class="board">';for(let i=0;i<64;i++){const r=i>>3,f=i&7;h+=`<button class="sq ${(r+f)%2?"dk":""} ${i==ch.bad?"bad":""}" data-a="sq" data-v="${i}" aria-label="${"abcdefgh"[f]}${8-r}">${i==ch.s?`<span class="pc">${GL[ch.p]}\uFE0E</span>`:""}</button>`}return h+"</div>"};

 return`<div style="margin-top:12px"><div class="row" style="margin-bottom:8px"><span class="k">Round ${Math.min(ch.r+1,ch.n)} of ${ch.n}</span><span>Click a square the ${ch.p} can move to.</span></div>${board()}<p class="k" style="min-height:1.4em" aria-live="polite">${esc(ch.msg)}</p>${ch.r>=ch.n?`<button class="btn" data-a="again">Practice again</button>`:""}</div>`};

 return`<div class="f" style="margin-top:12px"><label for="${id}">Try it</label><textarea id="${id}" class="code" spellcheck="false">${esc(l.code||"")}</textarea></div>

 for(const ln of(t||"").split("\n")){if(!ln.trim())continue;if(ln.startsWith("> ")){if(ul.length)fl();code.push(ln.slice(2))}else if(ln.startsWith("- ")){if(code.length)fl();ul.push(ln.slice(2))}else{fl();h+=ln.startsWith("## ")?`<h3 style="margin:16px 0 4px">${esc(ln.slice(3))}</h3>`:`<p>${esc(ln)}</p>`}}fl();return h};

 const ls=c.lessons||[],q=hasQ(c),isQ=q&&li>=ls.length,l=ls[li]||{t:"",b:""},d=me().done||[],passed=(me().passed||[]).includes(c.id),max=q?ls.length:ls.length-1,dn=!isQ&&d.includes(key(c.id,li));

   P("What is a function?","A function is a named block of code that does one job. Instead of rewriting the same steps again and again, you give the steps a name and call them whenever you need them.\n## Calling a function\nYou call a function by writing its name followed by brackets. Whatever you put inside the brackets is called an argument. It is the input you hand to the function.\n> print(\"hello\")\nHere print is the function and \"hello\" is the argument.\n## Why functions matter\n- They save you from repeating code\n- They give steps a clear name, so code reads like a sentence\n- You can fix a bug in one place instead of ten\nPress Run, then change the text and run it again.","print(\"hello\")\nprint(\"functions are reusable\")"),
   P("Built-in functions","Python ships with many ready-made functions called built-ins. You do not have to write them yourself.\n## The ones you will use constantly\n- print(x) shows x on screen\n- len(x) counts the characters or items in x\n- type(x) tells you what kind of value x is\n- max(a, b, c) and min(a, b, c) return the biggest and smallest value\n- round(x) rounds a number to the nearest whole number\n## Functions that give a value back\nSome functions hand a value back, and you can store it in a variable:\n> size = len(\"curious\")\n> print(size)\nRun the code below. Then add a line that prints the smallest of 4, 17 and 9.","word = \"curious\"\nprint(len(word))\nprint(type(word))\nprint(round(3.14159))\nprint(max(2, 8, 5))"),
   P("Make your own function with def","You can create your own functions with the def keyword.\n## The anatomy of a function\n> def greet(name):\n>     return \"hi \" + name\n- def tells Python you are defining a function\n- greet is the name you choose\n- name inside the brackets is a parameter, a placeholder for the input\n- the colon ends the line, and the indented lines below are the function's body\n- return sends a result back to whoever called the function\n## Parameters vs arguments\nA parameter is the placeholder in the definition. An argument is the real value you pass in when you call it. In greet(\"Sam\"), the argument \"Sam\" goes into the parameter name.\n## Indentation matters\nPython uses spaces at the start of a line to know which lines belong inside the function. Use four spaces. Run the example, then change the name.","def greet(name):\n    return \"hi \" + name\n\nprint(greet(\"Sam\"))\nprint(greet(\"Ana\"))"),
   P("return vs print","Beginners often mix up print and return. They look similar in a small program, but they do different jobs.\n- print shows a value on screen for a human to read\n- return hands a value back to the code that called the function, so it can be used again\n> def double(x):\n>     return x * 2\n> result = double(5)\n> print(result + 1)\nBecause double returned 10, we could add 1 to it. If double had only printed 10, result would hold nothing and the last line would fail.\n## No return means None\nA function with no return statement gives back None, which means no value. Run the example and compare the two results.","def shout(text):\n    print(text.upper())\n\ndef double(x):\n    return x * 2\n\nprint(double(4) + 1)\nprint(shout(\"hi\"))"),
   P("Challenge: double it","Time to write real code. Finish the function so it returns the number multiplied by 2.\nThe last line calls double(4) and prints the result. When your code prints 8, you pass.\nHint: replace the word pass with a return statement.","def double(x):\n    # return x times 2\n    pass\n\nprint(double(4))","8"),
   P("Multiple parameters and defaults","A function can take more than one input. Separate the parameters with commas, then give a value for each when you call it.\n> def rectangle_area(width, height):\n>     return width * height\n## Default values\nA parameter can have a default, which is used when the caller leaves that argument out.\n> def greet(name=\"friend\"):\n>     return \"hi \" + name\nCalling greet() gives hi friend, and calling greet(\"Sam\") gives hi Sam.\n## A rule to remember\nParameters with defaults must come after the ones without. Run the example, then try calling greet with and without a name.","def rectangle_area(width, height):\n    return width * height\n\ndef greet(name=\"friend\"):\n    return \"hi \" + name\n\nprint(rectangle_area(3, 4))\nprint(greet())\nprint(greet(\"Sam\"))"),
   P("Challenge: add two numbers","Write a function add(a, b) that returns a plus b.\nThe last line calls add(2, 3). When your code prints 5, you pass.","def add(a, b):\n    # your code here\n    pass\n\nprint(add(2, 3))","5"),
   P("Challenge: the welcome function","Put it all together. Write welcome(name, place) so it returns text like Welcome Sam from Earth.\nGive place a default value of \"Earth\". Join pieces of text with + and remember the spaces.\nYour code should print exactly:\n> Welcome Sam from Earth\n> Welcome Ana from Paris","def welcome(name, place=\"Earth\"):\n    # return a string like: Welcome Sam from Earth\n    pass\n\nprint(welcome(\"Sam\"))\nprint(welcome(\"Ana\", \"Paris\"))","Welcome Sam from Earth\nWelcome Ana from Paris")],
   quiz:[Q("What does len(\"curious\") return?",["6","7","8","curious"],1),Q("Which keyword creates a function?",["func","define","def","fun"],2),
   Q("What is the difference between print and return?",["There is no difference","print shows a value on screen, return sends a value back to the caller","return shows text on screen","print ends the function"],1),
   Q("What does print(add(2, 3) * 2) show if add returns a + b?",["5","10","23","6"],1),Q("What does a function give back if it has no return statement?",["0","An empty string","None","An error"],2),
   Q("In def greet(name=\"friend\"), what is \"friend\"?",["A required argument","A default value","The function name","A return value"],1),
   Q("Why does indentation matter in Python?",["It only affects looks","It shows which lines belong inside the function","It makes code faster","It is optional"],1),Q("What does print(max(3, 9, 4)) show?",["3","4","9","max"],2)]},
  {title:"How the chess pieces move",category:"Chess",blurb:"Learn every piece, practice on a board, then take the quiz.",level:"Beginner",mins:20,order:2,pass:70,lessons:[
   T("The board and the pieces","Chess is played on an 8 by 8 board with 64 squares that alternate between light and dark. Columns are called files and are labeled a to h. Rows are called ranks and are numbered 1 to 8.\n## Your army\nEach player starts with 16 pieces:\n- 8 pawns\n- 2 rooks\n- 2 knights\n- 2 bishops\n- 1 queen\n- 1 king\n## The goal\nYou win by checkmating the opponent's king, which means the king is attacked and has no way to escape. A king is never actually captured.\n## Piece values\nPlayers use points to compare pieces when deciding trades: a pawn is worth 1, a knight or bishop 3, a rook 5, and a queen 9. The king has no point value because losing him ends the game.\nNext you will learn how each piece moves and practice on a board. Mark this lesson done to continue."),
   C("The rook","The rook moves any number of squares in a straight line: forward, backward, left or right. It cannot move diagonally and it cannot jump over other pieces, so it needs open lines to be effective.\n## Where rooks shine\nRooks are strongest on open files, which are columns with no pawns in the way. Two rooks working together on the same file or rank are very powerful.\n## Worth remembering\n- A rook is worth about 5 points\n- The rook takes part in castling, a special move that tucks your king to safety\n- On an empty board, a rook attacks 14 squares from anywhere\nPractice: click any square the rook could legally move to. A wrong square means you try that round again.","rook",5),
   C("The bishop","The bishop moves any number of squares along a diagonal. It cannot jump over pieces.\n## Light and dark\nEach bishop stays on the color it started on for the whole game. That is why each player has two bishops: one for light squares and one for dark squares.\n## Strengths and weaknesses\n- Bishops are strong at long range when diagonals are open\n- A single bishop can never attack squares of the opposite color\n- A bishop is worth about 3 points, similar to a knight\nBishops love open positions, where long diagonals let them reach across the board.\nPractice: click any square the bishop could legally move to.","bishop",5),
   C("The knight","The knight moves in an L shape: two squares in one direction, then one square at a right angle.\n## The jumper\nThe knight is the only piece that can jump over other pieces, friend or foe. That makes it useful in crowded positions where other pieces are blocked.\n## Worth remembering\n- A knight always lands on the opposite color from the one it started on\n- Knights are strongest near the center, where they can reach up to 8 squares\n- A knight in a corner reaches only 2 squares\n- A knight is worth about 3 points\nPractice: click any square the knight could jump to.","knight",5),
   C("The queen","The queen is the most powerful piece. She moves any number of squares in a straight line or diagonally, so she combines the powers of the rook and the bishop.\n## Power and risk\nBecause she is worth about 9 points, trading your queen for a lower-value piece is usually a mistake. Beginners often bring the queen out too early, and the opponent chases her with smaller pieces. Develop your knights and bishops first.\n## Worth remembering\n- On an empty board a queen in the center attacks 27 squares\n- She cannot jump over pieces\n- She cannot move like a knight\nPractice: click any square the queen could move to.","queen",5),
   C("The king","The king moves exactly one square in any direction: up, down, sideways or diagonally.\n## Check and checkmate\nThe king can never move into a square attacked by an enemy piece. When your king is attacked, it is in check, and you must respond at once by moving away, blocking the attack or capturing the attacker. If none of those is possible, it is checkmate and the game is over.\n## Staying safe\n- Early in the game the king is safer tucked in a corner behind pawns, which is what castling does\n- In the endgame, when fewer pieces remain, the king becomes an active fighter\nPractice: click any square the king could move to.","king",5),
   C("The pawn","Pawns look weak, but they shape the whole game, and they move in a special way.\n## Moving\nA pawn moves forward one square and never backward. On its very first move it may move forward two squares instead. In this practice, white pawns move up the board.\n## Capturing\nA pawn captures one square diagonally forward, not straight ahead. That means a pawn can be blocked by a piece directly in front of it. The practice board is empty, so you will only practice forward moves.\n## Special rules\n- Promotion: a pawn that reaches the far side of the board is exchanged for a queen, rook, bishop or knight (most players choose a queen)\n- En passant: a special capture available right after an enemy pawn moves two squares past your pawn\nPractice: click a square the pawn could move to. The two-square move is only available from the starting row.","pawn",4)],
   quiz:[Q("A bishop starts on a light square. Which squares can it ever reach?",["Only light squares","Only dark squares","Any square","Only squares in its column"],0),Q("Which piece can jump over other pieces?",["Bishop","Rook","Knight","Queen"],2),
   Q("How many squares can a king move per turn (ignoring castling)?",["One","Two","Any number in a line","Up to three"],0),Q("The queen combines the movement of which two pieces?",["Rook and knight","Bishop and knight","Rook and bishop","King and rook"],2),
   Q("How far may a white pawn move on its first move?",["Only 1 square","1 or 2 squares","Up to 3 squares","Any number"],1),Q("A knight on e4 can move to which of these squares?",["e6","g5","e5","h4"],1),
   Q("A rook on a1 on an empty board can move to which square?",["b2","a8","c3","b3"],1),Q("Which statement about pawns is true?",["They move diagonally to go forward","They never move backward","They move like bishops","They can move in any direction"],1)]}];

 if(id=="edF"){readEdit();const{id:eid,...d}=edit;d.order=+d.order||0;d.mins=+d.mins||5;d.lessons=d.lessons.filter(l=>l.t.trim());d.pass=+d.pass||70;

  eid?await setDoc(doc(db,"courses",eid),d):await addDoc(collection(db,"courses"),d);modal=null;toast("Published for everyone");render()}
 }catch(x){console.error(x);toast("Could not save. Check your rules.")}});
