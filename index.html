<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>curiosity maxxing</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lora:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#60992d;--bg:#f7f9f2;--card:#fff;--ink:#1f2a14;--on:#fff;--radius:16px;--font:'Nunito',sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh;
 --muted:color-mix(in srgb,var(--ink) 55%,var(--bg));--line:color-mix(in srgb,var(--ink) 12%,var(--card));--soft:color-mix(in srgb,var(--brand) 10%,var(--card))}
h1,h2,h3{font-family:var(--font);font-weight:700;margin:0;line-height:1.2}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1020px;margin:0 auto;padding:16px 18px 80px}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0 20px}
.logo{font-size:1.4rem;font-weight:700;margin-right:auto;display:flex;gap:8px;align-items:center}
.logo i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:calc(var(--radius)*.6);background:var(--brand);color:var(--on)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700}
.btn:hover{border-color:var(--brand)}
.btn.p{background:var(--brand);border-color:var(--brand);color:var(--on)}
.btn.d{color:#d6455d}.btn.s{padding:4px 12px;font-size:.85rem}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hero{background:linear-gradient(135deg,var(--soft),var(--card));border:1px solid var(--line);border-radius:calc(var(--radius)*1.4);padding:28px}
.hero h1{font-size:clamp(1.7rem,5vw,2.6rem);max-width:18ch}.hero p{color:var(--muted);margin:8px 0 0}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);transition:width .4s}
.banner{background:var(--brand);color:var(--on);border-radius:var(--radius);padding:10px 16px;margin-bottom:14px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px color-mix(in srgb,var(--brand) 18%,transparent)}
.cov{background:color-mix(in srgb,var(--c,var(--brand)) 22%,var(--card));font-size:2.6rem;padding:20px;display:flex;justify-content:space-between;align-items:center}
.cov small{font-size:.75rem;font-weight:700;background:var(--card);border-radius:99px;padding:2px 10px}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}.cb p{margin:0;color:var(--muted);font-size:.92rem}
.meta{font-size:.82rem;color:var(--muted)}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-top:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{margin-left:auto}
.les{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:calc(var(--radius)*.7);padding:10px 14px;margin-top:8px}
.les.cur{border-color:var(--brand);background:var(--soft)}
.dot{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.75rem}
.dot.y{background:var(--brand);border-color:var(--brand);color:var(--on)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:720px){.two{grid-template-columns:1fr}}
.cm{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.cm:first-of-type{border:0}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:1.2rem}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.f label{font-weight:700;font-size:.88rem}
input,textarea,select{border:1.5px solid var(--line);border-radius:calc(var(--radius)*.6);padding:9px 12px;background:var(--bg);width:100%}
input[type=color]{padding:2px;height:40px}input[type=checkbox]{width:auto}input[type=range]{padding:0}
textarea{min-height:90px;resize:vertical}
.err{color:#d6455d;font-weight:700;min-height:1.3em}
.auth{max-width:390px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;max-width:460px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.tile b{display:block;font-size:1.5rem}.tile span{font-size:.8rem;color:var(--muted)}
.land{text-align:center;padding:7vh 0 24px}.land h1{font-size:clamp(2.4rem,9vw,4.6rem);letter-spacing:-.03em}
.land p{color:var(--muted);max-width:40ch;margin:12px auto 20px;font-size:1.1rem}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:24px 0 36px}
.feat div{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}.feat b{display:block;margin-bottom:4px}
.modal{position:fixed;inset:0;background:rgba(10,25,45,.5);display:grid;place-items:start center;padding:16px;overflow:auto;z-index:5}
.sheet{background:var(--card);border-radius:calc(var(--radius)*1.3);padding:24px;width:100%;max-width:600px;margin:3vh 0}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-weight:700;z-index:9}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><div class="wrap" id="app"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword as signUp,signInWithEmailAndPassword as signIn,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,onSnapshot,addDoc,setDoc,deleteDoc,doc,query,orderBy,arrayUnion,arrayRemove}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== 1. EDIT THESE ===== */
const firebaseConfig={apiKey:"AIzaSyCw1Dwp2dA6fUvrApz4QXdazjrCmWf3X5o",authDomain:"curiosity-maxxing.firebaseapp.com",projectId:"curiosity-maxxing",storageBucket:"curiosity-maxxing.firebasestorage.app",messagingSenderId:"935785815548",appId:"1:935785815548:web:77bc786ca9c2782866a679"};
const ADMIN_UID="PLSIY3aJbvUma04bivsXjuVt9a23";
const FORM_URL="https://forms.gle/AiDJinhiE2AC86YS9"; // can also be changed later inside the app
/* ========================= */

const auth=getAuth(initializeApp(firebaseConfig)),db=getFirestore(auth.app);
const THEMES={Leaf:["#60992d","#f7f9f2","#ffffff","#1f2a14"],Sky:["#4aa3ff","#f4f9ff","#ffffff","#16324f"],Blush:["#f0709c","#fff6f9","#ffffff","#4a2433"],Mint:["#25b385","#f1fbf7","#ffffff","#16382d"],Lilac:["#8b7bff","#f6f4ff","#ffffff","#2a2347"],Sunny:["#f5a623","#fffaf0","#ffffff","#45331a"],Night:["#6cb4ff","#0f1b2d","#172740","#e8f1ff"]};
const FONTS={Round:"'Fredoka',sans-serif",Clean:"'Nunito',sans-serif",Serif:"'Lora',serif"};
const LEVELS=["Beginner","Intermediate","Advanced"];
let user,courses=[],users=[],comments=[],likes=[],site={},view="home",cid=null,li=0,modal=null,edit=null,filter="All",mode="login",unsubs=[];
let theme={brand:"#60992d",bg:"#f7f9f2",card:"#ffffff",ink:"#1f2a14",radius:16,font:"Clean"};
try{Object.assign(theme,JSON.parse(localStorage.getItem("theme2")||"{}"))}catch{}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isAdmin=()=>user&&user.uid===ADMIN_UID;
const me=()=>users.find(u=>u.id===user?.uid)||{name:"",emoji:"🙂",done:[],bio:""};
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)};
const lum=h=>{const n=parseInt(h.slice(1),16),f=v=>(v/=255)<=.03928?v/12.92:((v+.055)/1.055)**2.4;return .2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255)};
function applyTheme(){const r=document.documentElement.style,t=theme;
 r.setProperty("--brand",t.brand);r.setProperty("--bg",t.bg);r.setProperty("--card",t.card);r.setProperty("--ink",t.ink);
 r.setProperty("--on",lum(t.brand)>.5?"#16324f":"#fff");r.setProperty("--radius",t.radius+"px");r.setProperty("--font",FONTS[t.font]||FONTS.Clean);
 try{localStorage.setItem("theme2",JSON.stringify(t))}catch{}}
applyTheme();
const saveMe=p=>setDoc(doc(db,"users",user.uid),p,{merge:true});
const key=(c,i)=>c+":"+i;
const day=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const streak=u=>{const s=new Set((u.log||[]).map(x=>x.split("|")[0]));let n=0,d=new Date();if(!s.has(day(d)))d.setDate(d.getDate()-1);while(s.has(day(d))){n++;d.setDate(d.getDate()-1)}return n};
const count=(u,p)=>{const t=day(),w=day(new Date(Date.now()-6*864e5));return new Set((u.log||[]).filter(x=>p=="all"||(p=="day"?x.startsWith(t):x.split("|")[0]>=w))).size};
let lb="week";
const prog=c=>{const n=(c.lessons||[]).length,d=me().done||[];return{n,d:(c.lessons||[]).filter((_,i)=>d.includes(key(c.id,i))).length}};

/* ---------- data ---------- */
onAuthStateChanged(auth,u=>{user=u;unsubs.forEach(f=>f());unsubs=[];
 if(u){const L=(q,fn)=>unsubs.push(onSnapshot(q,s=>{fn(s.docs.map(d=>({id:d.id,...d.data()})));render()},e=>console.error(e)));
  L(query(collection(db,"courses"),orderBy("order","asc")),x=>courses=x);
  L(collection(db,"users"),x=>users=x);
  L(query(collection(db,"comments"),orderBy("at","desc")),x=>comments=x);
  L(collection(db,"likes"),x=>likes=x);
  unsubs.push(onSnapshot(doc(db,"settings","site"),s=>{site=s.data()||{};render()}));
 }else{courses=[];users=[];view="home";}
 render()});

/* ---------- views ---------- */
const nav=()=>`<div class="nav"><div class="logo"><i>✦</i>${esc(site.name||"Nibble")}</div>
 <button class="btn ${view=="home"||view=="course"?"on":""}" data-a="go" data-v="home">courses</button>
 <button class="btn ${view=="people"?"on":""}" data-a="go" data-v="people">community</button>
 <button class="btn ${view=="me"?"on":""}" data-a="go" data-v="me">${esc(me().emoji||"🙂")} me</button>
 ${isAdmin()?`<button class="btn p" data-a="new">+ Course</button><button class="btn" data-a="site">⚙ Site</button>`:""}</div>`;

const LAND=`<div class="land"><div class="logo" style="justify-content:center;margin-bottom:28px"><i>✦</i>nibble</div><h1>learn with friends.</h1><p>short courses, a friendly leaderboard, and streaks that keep you coming back.</p><a class="btn p" href="#join">start learning free</a></div>
<div class="feat"><div><b>short courses</b><span class="meta">bite-sized lessons you can finish in minutes</span></div><div><b>leaderboard</b><span class="meta">see your rank today, this week, all time</span></div><div><b>streaks</b><span class="meta">keep your daily learning chain alive</span></div><div><b>community</b><span class="meta">chat under every course</span></div><div><b>progress</b><span class="meta">watch every course bar fill up</span></div><div><b>make it yours</b><span class="meta">pick any color, font and vibe</span></div></div>`;
const authView=()=>{const s=mode=="up";return LAND+`<div class="auth box" id="join"><div class="logo"><i>✦</i>${esc(site.name||"Nibble")}</div>
 <h2 style="margin:16px 0 4px">${s?"Create your account":"Welcome back"}</h2><p class="meta">Short courses you can finish in minutes.</p>
 <form id="authF">${s?`<div class="f"><label for="nm">Name</label><input id="nm" required maxlength="24"></div>`:""}
 <div class="f"><label for="em">Email</label><input id="em" type="email" required></div>
 <div class="f"><label for="pw">Password</label><input id="pw" type="password" minlength="6" required></div>
 <div class="err" id="err"></div><button class="btn p" style="width:100%">${s?"Sign up":"Log in"}</button></form>
 <p><button class="btn s" data-a="mode">${s?"I have an account":"New here? Sign up"}</button></p></div>`};

const likeCount=id=>likes.filter(l=>l.c==id).length;
function home(){const vis=courses.filter(c=>!c.draft||isAdmin());
 const cats=["All",...new Set(vis.map(c=>c.category).filter(Boolean))],list=vis.filter(c=>filter=="All"||c.category==filter);
 const tot=vis.reduce((a,c)=>a+prog(c).n,0),dn=vis.reduce((a,c)=>a+prog(c).d,0);
 return`${site.banner?`<div class="banner">${esc(site.banner)}</div>`:""}
 <div class="hero"><h1>${esc(site.tagline||"learn something new, together.")}</h1>
 <p>hey ${esc(me().name||"there")} 👋</p><div class="tiles"><div class="tile"><b>🔥 ${streak(me())}</b><span>day streak</span></div><div class="tile"><b>${count(me(),"week")}</b><span>lessons this week</span></div><div class="tile"><b>${dn}/${tot}</b><span>total done</span></div></div></div>
 <div class="chips">${cats.map(c=>`<button class="btn s ${c==filter?"on":""}" data-a="cat" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div>
 ${list.length?`<div class="grid">${list.map(c=>{const p=prog(c);return`<button class="card" style="--c:${esc(c.color||"")}" data-a="open" data-v="${c.id}">
  <div class="cov"><span>${esc(c.emoji||"✨")}</span>${c.draft?"<small>Draft</small>":c.featured?"<small>★ Featured</small>":""}</div>
  <div class="cb"><h3>${esc(c.title)}</h3><p>${esc(c.blurb)}</p><div class="meta">${esc(c.level||"")} · ${esc(c.mins||"?")} min · ${p.n} lessons · ♥ ${likeCount(c.id)}</div>
  <div class="bar" style="margin-top:6px"><i style="width:${p.n?p.d/p.n*100:0}%"></i></div></div></button>`}).join("")}</div>`
 :`<div class="box meta">No courses yet. ${isAdmin()?`<button class="btn p" data-a="seed">Add 2 starter courses</button>`:"Check back soon!"}</div>`}
 <div class="box row"><div><h3>Got an idea?</h3><span class="meta">Suggest a course you'd love to see.</span></div>
 <a class="btn p sp" href="${esc(site.formUrl||FORM_URL)}" target="_blank" rel="noopener" style="text-decoration:none">Suggest a course</a></div>`}

function course(){const c=courses.find(x=>x.id==cid);if(!c)return`<button class="btn" data-a="go" data-v="home">← Back</button>`;
 const ls=c.lessons||[],l=ls[li]||{t:"",b:""},d=me().done||[],liked=likes.some(x=>x.id==cid+"_"+user.uid),cms=comments.filter(x=>x.cid==cid);
 return`<div class="row"><button class="btn" data-a="go" data-v="home">← Back</button>${isAdmin()?`<button class="btn sp" data-a="edit" data-v="${c.id}">Edit course</button>`:""}</div>
 <div class="box" style="--c:${esc(c.color||"")}"><div class="row"><span style="font-size:2.6rem">${esc(c.emoji||"✨")}</span><div><h1 style="font-size:1.7rem">${esc(c.title)}</h1>
 <span class="meta">${esc(c.level||"")} · ${esc(c.mins||"?")} min · ${esc(c.category||"")}</span></div>
 <button class="btn sp ${liked?"p":""}" data-a="like">♥ ${likeCount(c.id)}</button></div><p>${esc(c.blurb)}</p></div>
 <div class="two"><div><h3 style="margin-top:20px">Lessons</h3>${ls.map((x,i)=>`<button class="les ${i==li?"cur":""}" data-a="les" data-v="${i}"><span class="dot ${d.includes(key(c.id,i))?"y":""}">${d.includes(key(c.id,i))?"✓":i+1}</span>${esc(x.t)}</button>`).join("")}</div>
 <div class="box"><h2>${esc(l.t)}</h2>${(l.b||"").split("\n").filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join("")}
 ${l.l?`<p><a class="btn s" href="${esc(l.l)}" target="_blank" rel="noopener" style="text-decoration:none">Open resource</a></p>`:""}
 <div class="row" style="margin-top:14px"><button class="btn p" data-a="done">${d.includes(key(c.id,li))?"Undo":"Mark as done ✓"}</button>
 <button class="btn s" data-a="les" data-v="${li-1}" ${li?"":"disabled"}>Back</button><button class="btn s" data-a="les" data-v="${li+1}" ${li<ls.length-1?"":"disabled"}>Next</button></div></div></div>
 ${site.comments===false?"":`<div class="box"><h3>Discussion</h3><form id="cmF" class="row" style="margin:10px 0"><input id="ct" maxlength="400" placeholder="Share a thought or ask a question" style="flex:1"><button class="btn p">Post</button></form>
 ${cms.map(x=>`<div class="cm"><div class="av">${esc(x.emoji)}</div><div style="flex:1"><b>${esc(x.name)}</b> <span class="meta">${x.at?new Date(x.at).toLocaleDateString():""}</span><div>${esc(x.text)}</div></div>
 ${isAdmin()||x.uid==user.uid?`<button class="btn s d" data-a="delc" data-v="${x.id}">✕</button>`:""}</div>`).join("")||'<p class="meta">Be the first to say something.</p>'}</div>`}`}

function people(){const top=[...users].filter(u=>u.name).sort((a,b)=>count(b,lb)-count(a,lb)).slice(0,10);
 return`<div class="two"><div class="box"><h3>leaderboard</h3><div class="row" style="margin:10px 0">${[["day","today"],["week","this week"],["all","all time"]].map(([k,n])=>`<button class="btn s ${k==lb?"on":""}" data-a="lb" data-v="${k}">${n}</button>`).join("")}</div>${top.map((u,i)=>`<div class="lb"><b>${i+1}</b><div class="av">${esc(u.emoji||"🙂")}</div><div style="flex:1"><b>${esc(u.name)}</b><div class="meta">${esc(u.bio||"")}</div></div><span class="meta">🔥${streak(u)}</span><b>${count(u,lb)} ✓</b></div>`).join("")}</div>
 <div class="box"><h3>Latest chatter</h3>${comments.slice(0,12).map(x=>{const c=courses.find(y=>y.id==x.cid);return`<div class="cm"><div class="av">${esc(x.emoji)}</div><div><b>${esc(x.name)}</b> <span class="meta">on ${esc(c?.title||"a course")}</span><div>${esc(x.text)}</div></div></div>`}).join("")||'<p class="meta">Nothing yet.</p>'}</div></div>`}

function profile(){const m=me();return`<div class="two"><div class="box"><h3>Your profile</h3><form id="meF" style="margin-top:12px">
 <div class="f"><label for="pn">Name</label><input id="pn" value="${esc(m.name)}" maxlength="24"></div>
 <div class="f"><label for="pe">Avatar emoji</label><input id="pe" value="${esc(m.emoji||"🙂")}" maxlength="4"></div>
 <div class="f"><label for="pb">Bio</label><input id="pb" value="${esc(m.bio||"")}" maxlength="80" placeholder="Learning chess and JS"></div>
 <button class="btn p">Save profile</button></form><p><button class="btn d" data-a="out">Log out</button></p></div>
 <div class="box"><h3>Make it yours</h3><p class="meta">Pick a look, then tweak it.</p>
 <div class="row">${Object.entries(THEMES).map(([n,t])=>`<button class="sw" title="${n}" style="background:${t[0]}" data-a="preset" data-v="${n}"></button>`).join("")}</div>
 <div class="two" style="gap:10px;margin-top:14px"><div class="f"><label for="tb">Accent</label><input id="tb" type="color" data-t="brand" value="${theme.brand}"></div>
 <div class="f"><label for="tg">Background</label><input id="tg" type="color" data-t="bg" value="${theme.bg}"></div></div>
 <div class="f"><label for="tr">Roundness</label><input id="tr" type="range" min="4" max="32" data-t="radius" value="${theme.radius}"></div>
 <div class="f"><label for="tf">Font</label><select id="tf" data-t="font">${Object.keys(FONTS).map(f=>`<option ${f==theme.font?"selected":""}>${f}</option>`).join("")}</select></div></div></div>`}

function editor(){const e=edit;return`<div class="modal"><div class="sheet"><div class="row"><h2>${e.id?"Edit course":"New course"}</h2><button class="btn s sp" data-a="x">Close</button></div>
 <form id="edF" style="margin-top:12px"><div class="f"><label for="et">Title</label><input id="et" required maxlength="60" value="${esc(e.title)}"></div>
 <div class="two" style="gap:10px"><div class="f"><label for="ee">Emoji</label><input id="ee" maxlength="4" value="${esc(e.emoji)}"></div><div class="f"><label for="ec">Category</label><input id="ec" value="${esc(e.category)}" list="cl"></div></div>
 <datalist id="cl">${[...new Set(courses.map(c=>c.category))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
 <div class="f"><label for="eb">Short description</label><input id="eb" maxlength="100" value="${esc(e.blurb)}"></div>
 <div class="two" style="gap:10px"><div class="f"><label for="el">Level</label><select id="el">${LEVELS.map(l=>`<option ${l==e.level?"selected":""}>${l}</option>`).join("")}</select></div>
 <div class="f"><label for="em">Minutes</label><input id="em" type="number" min="1" value="${esc(e.mins)}"></div></div>
 <div class="two" style="gap:10px"><div class="f"><label for="eo">Card color</label><input id="eo" type="color" value="${esc(e.color)}"></div>
 <div class="f"><label for="er">Sort number (low first)</label><input id="er" type="number" value="${esc(e.order)}"></div></div>
 <label><input id="ef" type="checkbox" ${e.featured?"checked":""}> Featured</label> &nbsp; <label><input id="ed" type="checkbox" ${e.draft?"checked":""}> Draft (only you see it)</label>
 <h3 style="margin:18px 0 6px">Lessons</h3>
 ${e.lessons.map((l,i)=>`<div class="box" style="margin-top:10px"><div class="row"><b>Lesson ${i+1}</b><span class="sp"></span>
 <button type="button" class="btn s" data-a="mv" data-v="${i}:-1">↑</button><button type="button" class="btn s" data-a="mv" data-v="${i}:1">↓</button><button type="button" class="btn s d" data-a="rm" data-v="${i}">Remove</button></div>
 <div class="f"><label for="lt${i}">Title</label><input id="lt${i}" value="${esc(l.t)}"></div>
 <div class="f"><label for="lb${i}">Text (new line = new paragraph)</label><textarea id="lb${i}">${esc(l.b)}</textarea></div>
 <div class="f"><label for="ll${i}">Link (optional, video or article)</label><input id="ll${i}" value="${esc(l.l)}"></div></div>`).join("")}
 <p><button type="button" class="btn" data-a="addl">+ Add lesson</button></p>
 <div class="row"><button class="btn p">Save for everyone</button>${e.id?`<button type="button" class="btn d sp" data-a="delcourse">Delete course</button>`:""}</div></form></div></div>`}

const siteModal=()=>`<div class="modal"><div class="sheet"><div class="row"><h2>Site settings</h2><button class="btn s sp" data-a="x">Close</button></div>
 <form id="stF" style="margin-top:12px"><div class="f"><label for="sn">Site name</label><input id="sn" value="${esc(site.name||"Nibble")}"></div>
 <div class="f"><label for="sg">Homepage headline</label><input id="sg" value="${esc(site.tagline||"")}"></div>
 <div class="f"><label for="sb">Announcement banner (empty = hidden)</label><input id="sb" value="${esc(site.banner||"")}"></div>
 <div class="f"><label for="sf">Google Form link</label><input id="sf" value="${esc(site.formUrl||"")}"></div>
 <label><input id="sc" type="checkbox" ${site.comments===false?"":"checked"}> Allow comments</label><p><button class="btn p">Save</button></p></form></div></div>`;

function render(){const keep={};$$("#app [id]").forEach(el=>keep[el.id]=el.type=="checkbox"?el.checked:el.value);
 const fid=document.activeElement?.id,pos=document.activeElement?.selectionStart;
 $("#app").innerHTML=!user?authView():nav()+({home,course,people,me:profile}[view]||home)()+(modal=="edit"?editor():modal=="site"?siteModal():"");
 if(modal||user)for(const id in keep){const el=document.getElementById(id);if(!el||el.type=="color"||el.type=="range")continue;if(el.type=="checkbox")el.checked=keep[id];else if(el.tagName!="SELECT"||1)el.value=keep[id]}
 if(fid){const el=document.getElementById(fid);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch{}}}}

/* ---------- actions ---------- */
function readEdit(){const g=i=>document.getElementById(i);if(!g("et"))return;
 Object.assign(edit,{title:g("et").value,emoji:g("ee").value,category:g("ec").value,blurb:g("eb").value,level:g("el").value,mins:g("em").value,color:g("eo").value,order:g("er").value,featured:g("ef").checked,draft:g("ed").checked});
 edit.lessons=edit.lessons.map((l,i)=>({t:g("lt"+i).value,b:g("lb"+i).value,l:g("ll"+i).value}))}
const blank=()=>({title:"",emoji:"✨",category:"",blurb:"",level:"Beginner",mins:5,color:"#4aa3ff",order:courses.length+1,featured:false,draft:false,lessons:[{t:"",b:"",l:""}]});
const A={
 go:v=>{view=v;modal=null;render()},mode:()=>{mode=mode=="up"?"in":"up";render()},cat:v=>{filter=v;render()},
 open:v=>{cid=v;li=0;view="course";render();scrollTo(0,0)},les:v=>{if(+v>=0)li=+v;render()},
 out:()=>signOut(auth),x:()=>{modal=null;render()},site:()=>{modal="site";render()},
 new:()=>{edit=blank();modal="edit";render()},
 edit:v=>{const c=courses.find(x=>x.id==v);edit={...blank(),...c,lessons:(c.lessons||[]).map(l=>({t:l.t,b:l.b,l:l.l||""}))};modal="edit";render()},
 addl:()=>{readEdit();edit.lessons.push({t:"",b:"",l:""});render()},rm:v=>{readEdit();edit.lessons.splice(+v,1);render()},
 mv:v=>{readEdit();const[i,d]=v.split(":").map(Number),j=i+d,L=edit.lessons;if(L[j])[L[i],L[j]]=[L[j],L[i]];render()},
 done:()=>{const k=key(cid,li),has=(me().done||[]).includes(k);saveMe(has?{done:arrayRemove(k)}:{done:arrayUnion(k),log:arrayUnion(day()+"|"+k)});if(!has)toast("nice work! 🎉")},
 lb:v=>{lb=v;render()},
 like:()=>{const id=cid+"_"+user.uid;likes.some(x=>x.id==id)?deleteDoc(doc(db,"likes",id)):setDoc(doc(db,"likes",id),{c:cid,u:user.uid})},
 delc:v=>deleteDoc(doc(db,"comments",v)),
 preset:v=>{const t=THEMES[v];Object.assign(theme,{brand:t[0],bg:t[1],card:t[2],ink:t[3]});applyTheme();render()},
 delcourse:async()=>{if(confirm("Delete this course for everyone?")){await deleteDoc(doc(db,"courses",edit.id));modal=null;view="home";render()}},
 seed:async()=>{const S=[
  {title:"Read the news like a pro",emoji:"📰",category:"News",blurb:"Spot reliable stories fast.",level:"Beginner",mins:6,color:"#4aa3ff",order:1,lessons:[{t:"Check the source",b:"Who published it? Can you name them?\nLook for an author and a date."},{t:"Look past headlines",b:"Headlines are built to grab you.\nRead the full story before you share."},{t:"Cross-check",b:"Find the same story on two other sites.\nNotice what is fact and what is opinion."}]},
  {title:"Chess basics",emoji:"♟️",category:"Chess",blurb:"Learn how every piece moves.",level:"Beginner",mins:8,color:"#8b7bff",order:2,lessons:[{t:"Pawns, rooks, bishops",b:"Pawns move forward 1 and capture diagonally.\nRooks glide straight. Bishops glide diagonally."},{t:"Knights, queens, kings",b:"Knights jump in an L shape.\nQueens move like a rook plus a bishop.\nKings move 1 square. Protect yours!"}]}];
  for(const s of S)await addDoc(collection(db,"courses"),s);toast("Added")}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a]){e.preventDefault();A[b.dataset.a](b.dataset.v)}});
document.addEventListener("input",e=>{const t=e.target.dataset.t;if(!t)return;theme[t]=t=="radius"?+e.target.value:e.target.value;applyTheme();
 if(t=="font")render()});
document.addEventListener("submit",async e=>{e.preventDefault();const id=e.target.id,g=i=>document.getElementById(i);
 try{
 if(id=="authF"){const em=g("em").value.trim(),pw=g("pw").value;
  try{if(mode=="up"){const c=await signUp(auth,em,pw);await setDoc(doc(db,"users",c.user.uid),{name:g("nm").value.trim(),emoji:"🙂",bio:"",done:[]})}else await signIn(auth,em,pw)}
  catch(x){g("err").textContent={"auth/email-already-in-use":"That email already has an account.","auth/invalid-credential":"Email or password is wrong.","auth/weak-password":"Use 6+ characters."}[x.code]||"Something went wrong."}}
 if(id=="meF"){await saveMe({name:g("pn").value.trim(),emoji:g("pe").value.trim()||"🙂",bio:g("pb").value.trim()});toast("Saved")}
 if(id=="cmF"){const t=g("ct").value.trim();if(!t)return;await addDoc(collection(db,"comments"),{cid,uid:user.uid,name:me().name||"Learner",emoji:me().emoji||"🙂",text:t,at:Date.now()});g("ct").value=""}
 if(id=="stF"){await setDoc(doc(db,"settings","site"),{name:g("sn").value,tagline:g("sg").value,banner:g("sb").value,formUrl:g("sf").value,comments:g("sc").checked});modal=null;toast("Saved");render()}
 if(id=="edF"){readEdit();const{id:eid,...d}=edit;d.order=+d.order||0;d.mins=+d.mins||5;d.lessons=d.lessons.filter(l=>l.t.trim());
  eid?await setDoc(doc(db,"courses",eid),d):await addDoc(collection(db,"courses"),d);modal=null;toast("Published for everyone");render()}
 }catch(x){console.error(x);toast("Couldn't save. Check your admin ID and rules.")}});
</script>
</body>
</html>
