function streakCard(){const m=me(),n=streak(m),have=new Set((m.log||[]).map(x=>x.split("|")[0])),fz=new Set(m.frozen||[]),td=day(),now=new Date(),f=new Date(now.getFullYear(),now.getMonth()+calM,1),dim=new Date(f.getFullYear(),f.getMonth()+1,0).getDate(),off=(f.getDay()+6)%7;
 let cells="",cnt=0;for(let i=0;i<off;i++)cells+="<span></span>";
 for(let d=1;d<=dim;d++){const k=day(new Date(f.getFullYear(),f.getMonth(),d)),c=have.has(k)?"on":fz.has(k)?"fz":k>td?"fu":"ms";if(c=="on")cnt++;cells+=`<span class="cd ${c}${k==td?" now":""}" aria-label="${k}: ${c=="on"?"studied":c=="fz"?"streak freeze used":c=="fu"?"upcoming":"not studied"}">${d}</span>`}

 <div class="big">${n}</div><div>day streak</div><div class="k" style="margin-top:6px">${cnt} study ${cnt==1?"day":"days"} this month</div><div class="k">Filled = studied. Blue = freeze. Dashed = missed.</div></div>
 <div><div class="row" style="margin-bottom:8px"><b>${f.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</b><span class="sp"></span><button class="btn s" data-a="cal" data-v="-1">Prev</button><button class="btn s" data-a="cal" data-v="1" ${calM>=0?"disabled":""}>Next</button></div>
 <div class="cal">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(w=>`<span class="dw">${w}</span>`).join("")}${cells}</div></div></section>`}

const MORE=[
{title:"Reading the news critically",category:"News",blurb:"Judge any story in minutes.",level:"Beginner",mins:15,order:3,pass:70,lessons:[
 mkT("Who is telling you this?","Every story comes from somewhere, and knowing where is the first step to judging it.\n## Check the source\n- Is it an outlet you can name, with a track record and a corrections policy?\n- Does the story have a named author and a date?\n- Does the site have an About page that says who runs it?\n## Know the type of content\nA news report describes what happened. An opinion piece argues for a view. Sponsored content is paid for by a company. They can sit side by side on the same site, so look for labels like Opinion, Analysis or Sponsored.\nA polished design does not make a source reliable, and an unfamiliar name does not make it fake. Look at the evidence, not the look."),
 mkT("Headlines versus the story","Headlines are short on purpose, which means they leave things out and are written to make you click.\n## Warning signs\n- All capitals, lots of exclamation marks or shock words\n- A question headline, which is often answered with no\n- A claim in the headline that the article never supports\n## What to do\nRead past the first paragraph before you form an opinion or share a story. Check whether the quotes and numbers come with context: compared to what, over what time, and from which study or official source?\nIf you remember one habit, make it this: read the whole piece before you react to the headline."),
 mkT("Cross-checking a claim","People who check facts for a living rarely stay on the page they are judging. They open new tabs. This is called lateral reading.\n## A quick routine\n- Search the main claim and see who else reports it\n- Look for at least two independent sources, not one story copied by many sites\n- Find the original source when you can: the official document, dataset, court filing or full study\n## Watch for copies\nMany outlets republish the same wire story, so ten websites can really be one source. Independent means a different reporter checked it.\nIf only one obscure site is reporting something huge, be patient. Real big news spreads fast."),
 mkT("Fact, opinion and bias","A fact can be checked and shown to be true or false. An opinion is a judgment that people can reasonably disagree about.\n## Spotting the difference\n- Fact: the city council voted 5 to 4 to approve the budget\n- Opinion: the budget is a disaster\n## Loaded language\nWords like slammed, destroyed or radical carry a judgment inside what looks like a report. Notice them.\n## Everyone has a perspective\nEvery outlet and every writer has a viewpoint. That is normal. The goal is not to find a perfectly neutral source. It is to read widely, compare how different outlets cover the same event, and keep the facts separate from the spin.")],
 quiz:[mkQ("What does lateral reading mean?",["Reading a page slowly from top to bottom","Opening other tabs to check what others say about a source or claim","Reading only the headline","Reading the comments"],1),mkQ("Which is an example of a fact?",["The budget is a disaster","The council voted 5 to 4 to approve the budget","Everyone hates the budget","The budget should be bigger"],1),mkQ("Why read past the headline?",["Headlines are always false","Headlines leave things out and may overstate the story","Headlines are legally binding","Articles are shorter"],1),mkQ("Ten sites publish the same wire story. How many independent sources is that?",["Ten","Five","One","Zero"],2),mkQ("What does a Sponsored label tell you?",["A government wrote it","A company paid for the content","It has been verified","It is the editor's opinion"],1)]},
{title:"Writing a clear letter",category:"Writing",blurb:"From planning to proofreading.",level:"Beginner",mins:15,order:4,pass:70,lessons:[
 mkT("Start with purpose and reader","Before you write a word, answer two questions: what do I want this letter to do, and who will read it?\n## Know your purpose\nA letter might inform, ask for something, complain, thank or apologize. If you can finish the sentence I am writing to, you are ready.\n## Know your reader\nA letter to a friend can be casual. A letter to a landlord, a school or a company needs a polite and clear tone. Think about what the reader already knows so you do not leave out key details or explain things twice.\nWrite your purpose in one sentence and keep it nearby while you draft."),
 mkT("The parts of a letter","Formal letters follow a familiar layout so the reader can find things quickly.\n## The layout\n- Your address at the top\n- The date\n- The recipient's name and address\n- A greeting, such as Dear Ms Lee,\n- The body, in short paragraphs\n- A closing, such as Sincerely, followed by your name\n## Friendly letters\nA letter to a friend usually needs only the date, a greeting, the body and a warm closing like Take care. Match the layout to the occasion."),
 mkT("Writing the body","The body is where the letter succeeds or fails.\n## Open with the point\nSay why you are writing in the first or second sentence. For example: I am writing to ask whether I can move my appointment to next Tuesday.\n## One idea per paragraph\nShort paragraphs are easier to read. Start a new one when you move to a new point.\n## Be specific and ask clearly\n- Give dates, names and numbers\n- State exactly what you want the reader to do\n- Say by when, if there is a deadline\nEnd with a short thank you or a line that makes the next step clear."),
 mkT("Tone and proofreading","Tone is the feeling your words create.\n## Choosing a tone\n- Formal: full words, polite phrases, no slang, such as I would be grateful if\n- Friendly: warm and natural, and contractions are fine\n## Closings\nIn British English, Yours sincerely goes with a named person (Dear Ms Lee) and Yours faithfully goes with Dear Sir or Madam. In American English, Sincerely works for almost everything.\n## Proofread\nRead the letter out loud and listen for mistakes. Check names, dates and spelling. Leave it for ten minutes and look again. A clean letter shows respect for the reader.")],
 quiz:[mkQ("What should you decide before you start writing?",["The font","Your purpose and who will read it","The paper color","How long it should be"],1),mkQ("Where should the main point usually go?",["In the last paragraph","In the first or second sentence","In the closing","Nowhere"],1),mkQ("Which closing suits a formal letter to a named person in the US?",["Later!","Sincerely","XOXO","Whatever"],1),mkQ("How many main ideas should a paragraph have?",["One","Five","As many as possible","None"],0),mkQ("A good proofreading habit is to...",["Skip it","Read the letter out loud","Only check the date","Use all capitals"],1)]},
{title:"The two main US parties",category:"Politics",blurb:"A neutral guide to Democrats and Republicans.",level:"Beginner",mins:15,order:5,pass:70,lessons:[
 mkT("A two-party system","The United States has two dominant political parties: the Democratic Party and the Republican Party. Almost every member of Congress and every governor belongs to one of them.\n## Why only two?\nMost elections use a first-past-the-post rule: whoever gets the most votes in a district wins, even without a majority. This tends to favor two big parties because votes for small parties are often seen as wasted.\n## Other parties\nThird parties such as the Libertarian and Green parties run candidates, and many voters register as independents. They rarely win national seats, but they can influence debates.\nParties are organizations, not government institutions. They pick candidates, raise money and write platforms."),
 mkT("The Democratic Party","The Democratic Party traces its roots to the 1790s and took its modern form around 1828.\n## What Democrats generally emphasize\n- A larger role for the federal government in areas like healthcare and education\n- Stronger regulation of business and the environment\n- Support for social programs and the safety net\n- Protecting abortion access and expanding civil rights protections\n## A reminder\nThese are general tendencies. Individual Democrats range from very progressive to moderate, and they often disagree with each other."),
 mkT("The Republican Party","The Republican Party was founded in 1854, originally to oppose the expansion of slavery. Abraham Lincoln was its first president.\n## What Republicans generally emphasize\n- A smaller federal government and more power for states\n- Lower taxes and less regulation of business\n- Strong national defense and tougher border policies\n- Gun rights and restrictions on abortion\n## A reminder\nThese are general tendencies. Individual Republicans range from libertarian to populist to traditionally conservative, and they often disagree with each other."),
 mkT("Looking past the labels","A party label tells you only part of the story.\n## Learn from primary sources\nEach party publishes a platform. Reading it in the party's own words is more reliable than reading someone describing it.\n## Look at issues, not just teams\nPeople often agree with each party on different issues, and many voters are independents.\n## Compare coverage\nRead how several outlets across the spectrum cover the same event. Ask what each one emphasizes and what it leaves out.\nThe goal of this course is understanding, not telling you what to think.")],
 quiz:[mkQ("Which two parties dominate US national politics?",["Democratic and Republican","Libertarian and Green","Whig and Federalist","Labour and Conservative"],0),mkQ("In what year was the Republican Party founded?",["1776","1854","1912","1968"],1),mkQ("Why does first-past-the-post tend to favor two big parties?",["It is required by law","Votes for small parties are often seen as wasted","Small parties are banned","It uses ranked ballots"],1),mkQ("What is the most reliable way to learn what a party stands for?",["Reading its platform","Asking a rival","Reading memes","Guessing"],0),mkQ("Which statement is accurate?",["All members of a party agree on everything","Members of a party can hold a range of views","Parties are government agencies","Only two parties are allowed"],1)]},
{title:"JavaScript basics",category:"Coding",blurb:"Variables, functions and decisions in the language of the web.",level:"Beginner",mins:20,order:6,pass:70,lessons:[
 mkT("What JavaScript is","JavaScript is the programming language of the web. It makes pages interactive: menus that open, forms that check themselves, games that run in the browser.\n## Where it runs\nEvery web browser has a JavaScript engine built in, so you do not need to install anything to try it.\n## Your first line\nPress F12 in your browser to open the developer tools, click Console, and type:\n> console.log(\"hello\")\nconsole.log shows a value in the console. It is the JavaScript version of Python's print. Try changing the text."),
 mkT("Variables and types","A variable is a labeled box that holds a value.\n> let age = 12\n> const name = \"Sam\"\n- let makes a variable you can change later\n- const makes one that cannot be reassigned\n## Types of values\n- Strings are text, written in quotes\n- Numbers, like 42 or 3.14\n- Booleans, which are true or false\n## Joining text\n> console.log(\"Hi \" + name)\nUse const by default and switch to let only when the value needs to change. Try these in the console."),
 mkT("Functions","A function is a reusable block of code, just like in Python.\n> function greet(name) {\n>   return \"hi \" + name\n> }\n> console.log(greet(\"Sam\"))\n## Arrow functions\nThere is a shorter way to write the same thing:\n> const double = x => x * 2\n> console.log(double(4))\n## Remember\n- Parameters are placeholders, arguments are the real values\n- return gives a value back to the caller\n- Curly braces mark where the function body starts and ends"),
 mkT("Decisions and loops","Programs often need to choose and to repeat.\n## if and else\n> if (age >= 18) {\n>   console.log(\"adult\")\n> } else {\n>   console.log(\"minor\")\n> }\n## Comparing\n- === means equal to\n- !== means not equal to\n- > and < compare size\n## Loops\nA for loop repeats code a set number of times:\n> for (let i = 0; i < 3; i++) {\n>   console.log(i)\n> }\nThis prints 0, 1 and 2. Prefer === over == to avoid surprises.")],
 quiz:[mkQ("Which keyword makes a variable you can change later?",["const","let","def","static"],1),mkQ("What does console.log do?",["Deletes a variable","Shows a value in the console","Creates a function","Saves a file"],1),mkQ("Which of these is a boolean?",["\"true\"","true","1","yes"],1),mkQ("What does a for loop with i from 0 while i < 3 print?",["1 2 3","0 1 2","0 1 2 3","Nothing"],1),mkQ("Which operator checks that two values are equal?",["=","===","=>","!=="],1)]}];

  const S=[{title:"Basic functions in Python",category:"Coding",blurb:"Write and run real Python, then prove it in a quiz.",level:"Beginner",mins:25,order:1,pass:70,lessons:[
   P("What is a function?","A function is a named block of code that does one job. Instead of rewriting the same steps again and again, you give the steps a name and call them whenever you need them.\n## Calling a function\nYou call a function by writing its name followed by brackets. Whatever you put inside the brackets is called an argument. It is the input you hand to the function.\n> print(\"hello\")\nHere print is the function and \"hello\" is the argument.\n## Why functions matter\n- They save you from repeating code\n- They give steps a clear name, so code reads like a sentence\n- You can fix a bug in one place instead of ten\nPress Run, then change the text and run it again.","print(\"hello\")\nprint(\"functions are reusable\")"),
   P("Built-in functions","Python ships with many ready-made functions called built-ins. You do not have to write them yourself.\n## The ones you will use constantly\n- print(x) shows x on screen\n- len(x) counts the characters or items in x\n- type(x) tells you what kind of value x is\n- max(a, b, c) and min(a, b, c) return the biggest and smallest value\n- round(x) rounds a number to the nearest whole number\n## Functions that give a value back\nSome functions hand a value back, and you can store it in a variable:\n> size = len(\"curious\")\n> print(size)\nRun the code below. Then add a line that prints the smallest of 4, 17 and 9.","word = \"curious\"\nprint(len(word))\nprint(type(word))\nprint(round(3.14159))\nprint(max(2, 8, 5))"),
   P("Make your own function with def","You can create your own functions with the def keyword.\n## The anatomy of a function\n> def greet(name):\n>     return \"hi \" + name\n- def tells Python you are defining a function\n- greet is the name you choose\n- name inside the brackets is a parameter, a placeholder for the input\n- the colon ends the line, and the indented lines below are the function's body\n- return sends a result back to whoever called the function\n## Parameters vs arguments\nA parameter is the placeholder in the definition. An argument is the real value you pass in when you call it. In greet(\"Sam\"), the argument \"Sam\" goes into the parameter name.\n## Indentation matters\nPython uses spaces at the start of a line to know which lines belong inside the function. Use four spaces. Run the example, then change the name.","def greet(name):\n    return \"hi \" + name\n\nprint(greet(\"Sam\"))\nprint(greet(\"Ana\"))"),
   P("return vs print","Beginners often mix up print and return. They look similar in a small program, but they do different jobs.\n- print shows a value on screen for a human to read\n- return hands a value back to the code that called the function, so it can be used again\n> def double(x):\n>     return x * 2\n> result = double(5)\n> print(result + 1)\nBecause double returned 10, we could add 1 to it. If double had only printed 10, result would hold nothing and the last line would fail.\n## No return means None\nA function with no return statement gives back None, which means no value. Run the example and compare the two results.","def shout(text):\n    print(text.upper())\n\ndef double(x):\n    return x * 2\n\nprint(double(4) + 1)\nprint(shout(\"hi\"))"),
   P("Challenge: double it","Time to write real code. Finish the function so it returns the number multiplied by 2.\nThe last line calls double(4) and prints the result. When your code prints 8, you pass.\nHint: replace the word pass with a return statement.","def double(x):\n    # return x times 2\n    pass\n\nprint(double(4))","8"),
   P("Multiple parameters and defaults","A function can take more than one input. Separate the parameters with commas, then give a value for each when you call it.\n> def rectangle_area(width, height):\n>     return width * height\n## Default values\nA parameter can have a default, which is used when the caller leaves that argument out.\n> def greet(name=\"friend\"):\n>     return \"hi \" + name\nCalling greet() gives hi friend, and calling greet(\"Sam\") gives hi Sam.\n## A rule to remember\nParameters with defaults must come after the ones without. Run the example, then try calling greet with and without a name.","def rectangle_area(width, height):\n    return width * height\n\ndef greet(name=\"friend\"):\n    return \"hi \" + name\n\nprint(rectangle_area(3, 4))\nprint(greet())\nprint(greet(\"Sam\"))"),
   P("Challenge: add two numbers","Write a function add(a, b) that returns a plus b.\nThe last line calls add(2, 3). When your code prints 5, you pass.","def add(a, b):\n    # your code here\n    pass\n\nprint(add(2, 3))","5"),
   P("Challenge: the welcome function","Put it all together. Write welcome(name, place) so it returns text like Welcome Sam from Earth.\nGive place a default value of \"Earth\". Join pieces of text with + and remember the spaces.\nYour code should print exactly:\n> Welcome Sam from Earth\n> Welcome Ana from Paris","def welcome(name, place=\"Earth\"):\n    # return a string like: Welcome Sam from Earth\n    pass\n\nprint(welcome(\"Sam\"))\nprint(welcome(\"Ana\", \"Paris\"))","Welcome Sam from Earth\nWelcome Ana from Paris")],
   quiz:[Q("What does len(\"curious\") return?",["6","7","8","curious"],1),Q("Which keyword creates a function?",["func","define","def","fun"],2),
   Q("What is the difference between print and return?",["There is no difference","print shows a value on screen, return sends a value back to the caller","return shows text on screen","print ends the function"],1),
   Q("What does print(add(2, 3) * 2) show if add returns a + b?",["5","10","23","6"],1),Q("What does a function give back if it has no return statement?",["0","An empty string","None","An error"],2),
   Q("In def greet(name=\"friend\"), what is \"friend\"?",["A required argument","A default value","The function name","A return value"],1),
   Q("Why does indentation matter in Python?",["It only affects looks","It shows which lines belong inside the function","It makes code faster","It is optional"],1),Q("What does print(max(3, 9, 4)) show?",["3","4","9","max"],2)]},
  {title:"How the chess pieces move",category:"Chess",blurb:"Learn every piece, practice on a board, then take the quiz.",level:"Beginner",mins:20,order:2,pass:70,lessons:[
   T("The board and the pieces","Chess is played on an 8 by 8 board with 64 squares that alternate between light and dark. Columns are called files and are labeled a to h. Rows are called ranks and are numbered 1 to 8.\n## Your army\nEach player starts with 16 pieces:\n- 8 pawns\n- 2 rooks\n- 2 knights\n- 2 bishops\n- 1 queen\n- 1 king\n## The goal\nYou win by checkmating the opponent's king, which means the king is attacked and has no way to escape. A king is never actually captured.\n## Piece values\nPlayers use points to compare pieces when deciding trades: a pawn is worth 1, a knight or bishop 3, a rook 5, and a queen 9. The king has no point value because losing him ends the game.\nNext you will learn how each piece moves and practice on a board. Mark this lesson done to continue."),
   C("The rook","The rook moves any number of squares in a straight line: forward, backward, left or right. It cannot move diagonally and it cannot jump over other pieces, so it needs open lines to be effective.\n## Where rooks shine\nRooks are strongest on open files, which are columns with no pawns in the way. Two rooks working together on the same file or rank are very powerful.\n## Worth remembering\n- A rook is worth about 5 points\n- The rook takes part in castling, a special move that tucks your king to safety\n- On an empty board, a rook attacks 14 squares from anywhere\nPractice: click any square the rook could legally move to. A wrong square means you try that round again.","rook",5),
   C("The bishop","The bishop moves any number of squares along a diagonal. It cannot jump over pieces.\n## Light and dark\nEach bishop stays on the color it started on for the whole game. That is why each player has two bishops: one for light squares and one for dark squares.\n## Strengths and weaknesses\n- Bishops are strong at long range when diagonals are open\n- A single bishop can never attack squares of the opposite color\n- A bishop is worth about 3 points, similar to a knight\nBishops love open positions, where long diagonals let them reach across the board.\nPractice: click any square the bishop could legally move to.","bishop",5),
   C("The knight","The knight moves in an L shape: two squares in one direction, then one square at a right angle.\n## The jumper\nThe knight is the only piece that can jump over other pieces, friend or foe. That makes it useful in crowded positions where other pieces are blocked.\n## Worth remembering\n- A knight always lands on the opposite color from the one it started on\n- Knights are strongest near the center, where they can reach up to 8 squares\n- A knight in a corner reaches only 2 squares\n- A knight is worth about 3 points\nPractice: click any square the knight could jump to.","knight",5),
   C("The queen","The queen is the most powerful piece. She moves any number of squares in a straight line or diagonally, so she combines the powers of the rook and the bishop.\n## Power and risk\nBecause she is worth about 9 points, trading your queen for a lower-value piece is usually a mistake. Beginners often bring the queen out too early, and the opponent chases her with smaller pieces. Develop your knights and bishops first.\n## Worth remembering\n- On an empty board a queen in the center attacks 27 squares\n- She cannot jump over pieces\n- She cannot move like a knight\nPractice: click any square the queen could move to.","queen",5),
   C("The king","The king moves exactly one square in any direction: up, down, sideways or diagonally.\n## Check and checkmate\nThe king can never move into a square attacked by an enemy piece. When your king is attacked, it is in check, and you must respond at once by moving away, blocking the attack or capturing the attacker. If none of those is possible, it is checkmate and the game is over.\n## Staying safe\n- Early in the game the king is safer tucked in a corner behind pawns, which is what castling does\n- In the endgame, when fewer pieces remain, the king becomes an active fighter\nPractice: click any square the king could move to.","king",5),
   C("The pawn","Pawns look weak, but they shape the whole game, and they move in a special way.\n## Moving\nA pawn moves forward one square and never backward. On its very first move it may move forward two squares instead. In this practice, white pawns move up the board.\n## Capturing\nA pawn captures one square diagonally forward, not straight ahead. That means a pawn can be blocked by a piece directly in front of it. The practice board is empty, so you will only practice forward moves.\n## Special rules\n- Promotion: a pawn that reaches the far side of the board is exchanged for a queen, rook, bishop or knight (most players choose a queen)\n- En passant: a special capture available right after an enemy pawn moves two squares past your pawn\nPractice: click a square the pawn could move to. The two-square move is only available from the starting row.","pawn",4)],
   quiz:[Q("A bishop starts on a light square. Which squares can it ever reach?",["Only light squares","Only dark squares","Any square","Only squares in its column"],0),Q("Which piece can jump over other pieces?",["Bishop","Rook","Knight","Queen"],2),
   Q("How many squares can a king move per turn (ignoring castling)?",["One","Two","Any number in a line","Up to three"],0),Q("The queen combines the movement of which two pieces?",["Rook and knight","Bishop and knight","Rook and bishop","King and rook"],2),
   Q("How far may a white pawn move on its first move?",["Only 1 square","1 or 2 squares","Up to 3 squares","Any number"],1),Q("A knight on e4 can move to which of these squares?",["e6","g5","e5","h4"],1),
   Q("A rook on a1 on an empty board can move to which square?",["b2","a8","c3","b3"],1),Q("Which statement about pawns is true?",["They move diagonally to go forward","They never move backward","They move like bishops","They can move in any direction"],1)]}];
